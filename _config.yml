title: Sailing Scoreboard Docs
logo: "/images/ssblogo-h.png"
description: User documentation for Sailing Scoreboard
theme: just-the-docs

# Served from the production web server at https://sailingscoreboard.com/docs/
# (built by .github/workflows/publish-site.yml, pulled by the server from the `site` branch)
url: https://sailingscoreboard.com
baseurl: /docs

aux_links:
  Sailing Scoreboard: https://www.sailingscoreboard.com/workbench/

# Repo files that are not part of the published site
# (setting `exclude` replaces Jekyll's defaults, so they are repeated here: without
# vendor/ the build tries to read the bundled gems and fails)
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
